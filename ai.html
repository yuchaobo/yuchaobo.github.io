<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>乘法积木 · 竖式联动</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #fef9e7;
      color: #2c2416;
      -webkit-tap-highlight-color: transparent;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #canvas-wrap canvas { display: block; width: 100%; height: 100%; }

    .pile-labels {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      overflow: hidden;
    }
    .pile-label {
      position: absolute;
      transform: translate(-50%, 0);
      padding: 5px 12px;
      font-size: 15px;
      font-weight: 700;
      color: #1a1408;
      background: rgba(255, 252, 245, 0.94);
      border: 1px solid rgba(180, 150, 100, 0.55);
      border-radius: 8px;
      box-shadow: 0 2px 10px rgba(120, 90, 40, 0.15);
      white-space: nowrap;
    }
    .pile-label.main {
      color: #1a1408;
      font-size: 17px;
      font-weight: 800;
      transform: translate(-50%, -100%);
      margin-top: -6px;
    }
    .pile-label.sum {
      color: #1e8449;
      border-color: rgba(46, 139, 87, 0.45);
      font-size: 16px;
    }

    .overlay { position: fixed; z-index: 10; pointer-events: none; }
    .overlay * { pointer-events: auto; }

    .panel {
      top: 14px;
      left: 14px;
      width: min(280px, 50vw);
      padding: 15px;
      background: rgba(255, 252, 245, 0.94);
      border: 1px solid rgba(200, 170, 120, 0.45);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(120, 90, 40, 0.12);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .field .icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .icon-a { background: rgba(231, 76, 60, 0.2); color: #c0392b; }
    .icon-b { background: rgba(155, 89, 182, 0.2); color: #8e44ad; }
    .field label { flex: 1; opacity: 0.9; white-space: nowrap; color: #2c2416; }
    .field .val {
      min-width: 64px;
      min-height: 32px;
      padding: 6px 12px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(180, 150, 100, 0.5);
      border-radius: 9px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      color: #2c2416;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field .val.empty {
      color: rgba(80, 65, 45, 0.4);
    }
    .field .val.empty::after {
      content: "—";
    }
    .field .val:hover, .field .val.active {
      border-color: rgba(52, 152, 219, 0.65);
      box-shadow: 0 0 10px rgba(52, 152, 219, 0.25);
    }

    .btn-row { margin-top: 8px; }
    .btn-row > .btn:first-child { margin-top: 0; }
    .btn-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-top: 12px;
      gap: 2px;
    }
    .btn-flow .btn {
      margin-top: 0;
      width: 76px;
      height: 76px;
      padding: 0;
      border-radius: 12px;
      font-size: 24px;
      flex-shrink: 0;
    }
    .flow-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      color: #0d0a06;
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      -webkit-text-stroke: 1.2px #0d0a06;
      paint-order: stroke fill;
      pointer-events: none;
      user-select: none;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 12px 14px;
      margin-top: 10px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
      letter-spacing: 0.02em;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); filter: brightness(0.95); }
    .btn-purple { background: linear-gradient(135deg, #8e44ad, #9b59b6); box-shadow: 0 4px 16px rgba(142, 68, 173, 0.45); }
    .btn-orange { background: linear-gradient(135deg, #d35400, #e67e22); box-shadow: 0 4px 16px rgba(230, 126, 34, 0.4); }
    .btn-green { background: linear-gradient(135deg, #1e8449, #27ae60); box-shadow: 0 4px 16px rgba(39, 174, 96, 0.4); }
    .btn-blue { background: linear-gradient(135deg, #2471a3, #3498db); box-shadow: 0 4px 16px rgba(52, 152, 219, 0.4); }

    @keyframes eqFadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .hint-bottom {
      bottom: 14px;
      left: 14px;
      max-width: min(340px, 70vw);
      padding: 10px 14px;
      background: rgba(255, 252, 245, 0.94);
      border-radius: 12px;
      border: 1px solid rgba(200, 170, 120, 0.45);
      box-shadow: 0 8px 24px rgba(120, 90, 40, 0.12);
      font-size: 12px;
      line-height: 1.65;
      color: #2c2416;
      pointer-events: none;
    }
    .hint-bottom strong { color: #2471a3; font-weight: 600; }

    /* 数字键盘 */
    .keypad-wrap {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }
    .keypad-wrap.show { display: flex; }
    .keypad {
      width: min(280px, 88vw);
      padding: 16px;
      background: rgba(28, 34, 48, 0.95);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .key {
      aspect-ratio: 1;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: #e8eef8;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .key:hover { background: rgba(255, 255, 255, 0.16); }
    .key.highlight {
      background: rgba(52, 152, 219, 0.45);
      box-shadow: 0 0 16px rgba(52, 152, 219, 0.6);
    }
    .key-del { background: rgba(231, 76, 60, 0.75); font-size: 16px; }
    .key-close { background: rgba(120, 130, 150, 0.5); }
    .key-ok { background: rgba(39, 174, 96, 0.85); font-size: 18px; }
    .key-wide { grid-column: span 1; }

    /* 竖式乘法面板 */
    .vertical-panel {
      top: 32px;
      right: 14px;
      left: auto;
      bottom: auto;
      width: min(400px, 56vw);
      padding: 16px 18px;
      background: rgba(255, 252, 245, 0.96);
      border: 1px solid rgba(200, 170, 120, 0.45);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(120, 90, 40, 0.12);
    }
    .vertical-multiply { position: relative; }
    .sheet {
      position: relative;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      min-height: 168px;
    }
    .digits-layer {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.1rem;
      pointer-events: none;
      font-family: "KaiTi", "STKaiti", "楷体", serif;
    }
    .digits-layer > .v-row:first-child { margin-bottom: 1.15rem; }
    .v-row.v-row-multiply { margin-top: 0.15rem; }
    .v-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      min-width: 4.5rem;
      font-size: 2.15rem;
      line-height: 1.2;
      letter-spacing: 0.2em;
      color: #1a237e;
    }
    .v-row .digit {
      width: 1.1em;
      text-align: center;
      letter-spacing: 0;
    }
    .v-row .operator {
      width: 1.2em;
      text-align: center;
      margin-right: 0.1em;
      color: #c62828;
      letter-spacing: 0;
    }
    .v-row .placeholder { width: 1.1em; }
    .v-divider {
      width: 100%;
      height: 2px;
      background: #1a237e;
      margin: 0.35rem 0 0.5rem;
      border-radius: 2px;
    }
    .result-row { min-height: 2.4rem; letter-spacing: 0; }
    .result-row .digit-slot {
      width: 1.1em;
      height: 1.1em;
      min-height: 2.4rem;
    }
    .digit-slot[hidden] { display: none; }
    #writeCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .v-equations {
      margin-top: 8px;
      font-family: "KaiTi", "STKaiti", "楷体", serif;
      font-size: 1rem;
      line-height: 1.65;
      color: #1565c0;
      min-height: 0;
    }
    .v-equations:empty { display: none; }
    .v-equations .eq {
      opacity: 0;
      animation: eqFadeIn 0.35s ease forwards;
    }
    .v-btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .v-action-btn {
      font-size: 11px;
      color: #78909c;
      background: none;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .v-action-btn:hover { color: #3949ab; border-color: #3949ab; }
    .v-action-btn.primary { color: #3949ab; border-color: #3949ab; font-weight: 600; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="pile-labels" class="pile-labels"></div>

  <div class="overlay panel">
    <div class="field">
      <span class="icon icon-a">✎</span>
      <label>多位数</label>
      <span class="val" id="valA" data-target="a">24</span>
    </div>
    <div class="field">
      <span class="icon icon-b">×</span>
      <label>一位数</label>
      <span class="val" id="valB" data-target="b">2</span>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-purple" id="btnGen">⊕ 生成 &amp; 重置</button>
      <div class="btn-flow">
        <button type="button" class="btn btn-orange" id="btnSplit">拆</button>
        <span class="flow-arrow" aria-hidden="true">↓</span>
        <button type="button" class="btn btn-blue" id="btnCalc">算</button>
        <span class="flow-arrow" aria-hidden="true">↓</span>
        <button type="button" class="btn btn-green" id="btnCombine">合</button>
      </div>
    </div>
  </div>

  <div class="overlay vertical-panel" id="verticalPanel">
    <div class="vertical-multiply">
      <div class="sheet" id="sheet">
        <div class="digits-layer" id="digitsLayer"></div>
        <canvas id="writeCanvas" aria-label="竖式书写区域"></canvas>
      </div>
      <div class="v-equations" id="vEquations" aria-live="polite"></div>
      <div class="v-btn-row">
        <button type="button" class="v-action-btn" id="vResetBtn">清除重写</button>
        <button type="button" class="v-action-btn primary" id="vNextBtn">下一题</button>
      </div>
    </div>
  </div>

  <div class="overlay hint-bottom" id="hintBottom"></div>

  <div class="keypad-wrap" id="keypadWrap">
    <div class="keypad">
      <div class="keypad-grid" id="keypadGrid"></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const GROUP_COLORS = [0xe67e22, 0xf1c40f, 0x3498db, 0x9b59b6, 0x1abc9c, 0xe74c3c, 0x2ecc71, 0x95a5a6, 0xd35400];
    const TENS_COLOR = 0xe67e22;
    const ONES_COLOR = 0x3498db;
    const BLOCK = 0.42;
    const GAP = 0.46;
    const COL_STEP = 1.05;
    /** 堆内方块横向、纵深间隙（相同，不改方块尺寸）；竖向仍用 GAP */
    const PILE_INNER_GAP = 0.2;
    const BLOCK_SP = BLOCK + PILE_INNER_GAP;
    const PLACES = [1, 10, 100, 1000];
    const MAX_NUM_A = 9999;

    let numA = 24, numB = 2;
    let mode = "multiply"; // multiply | decompose | calculate | combine
    let verticalGatheredPlaces = []; // 竖式独立流程：已提出并合并的位
    let eqStep = 0; // 0 空 | 1 总式 | 2 +按位乘 | 3 +相加
    let visiblePileFormulasKey = "";
    let visiblePileFormulasList = [];
    let blocks = [];
    let segments = [];
    let selectedSeg = null;
    let dragActive = false;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
    const dragHit = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();
    let keypadTarget = null;
    let keypadBuffer = "";

    const wrap = document.getElementById("canvas-wrap");
    const pileLabelsEl = document.getElementById("pile-labels");
    /** 同位各组中心最大间距，小于此值才显示「几×几」标签 */
    const CLUSTER_MAX_DIST = 2.1;
    const FIT_MARGIN = 1.35;
    /** 小布局（如两位数）至少按此横向跨度取景，避免过近 */
    const FIT_SPAN_MIN = 10;
    /** 横向跨度 ≤ 参考值时线性取景；超出部分次线性压缩，避免大数时相机过远 */
    const FIT_SPAN_REF = 14;
    const FIT_SPAN_GROWTH = 0.55;
    const FIT_DIST_MAX = 30;
    const VIEW_OFFSET = new THREE.Vector3(0.48, 0.38, 0.72).normalize();
    const _worldUp = new THREE.Vector3(0, 1, 0);
    const _viewDir = new THREE.Vector3();
    const _camRight = new THREE.Vector3();
    const _projVec = new THREE.Vector3();
    const hintBottom = document.getElementById("hintBottom");
    const valA = document.getElementById("valA");
    const valB = document.getElementById("valB");
    const keypadWrap = document.getElementById("keypadWrap");
    const keypadGrid = document.getElementById("keypadGrid");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfef9e7);
    scene.fog = new THREE.Fog(0xfef9e7, 12, 80);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(6, 7.5, 11);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.sortObjects = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 2.2, 0);
    controls.minDistance = 5;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.enablePan = true;

    scene.add(new THREE.AmbientLight(0xfff5e0, 0.75));
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(8, 14, 6);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    scene.add(dir);
    const rim = new THREE.DirectionalLight(0x88bbff, 0.35);
    rim.position.set(-6, 4, -8);
    scene.add(rim);

    const blockGroup = new THREE.Group();
    scene.add(blockGroup);

    const grid = new THREE.GridHelper(24, 24, 0xc4a574, 0xe8dcc0);
    grid.position.y = 0.01;
    scene.add(grid);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.MeshStandardMaterial({ color: 0xf5e8c8, transparent: true, opacity: 0.9 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    function getPlaceDigits(n) {
      return PLACES.map((place) => ({
        place,
        digit: Math.floor(n / place) % 10
      }));
    }

    const PLACE_GAP = 0.5;
    /** 拆/生成：百、十、个之间的横向间距 */
    const DECOMPOSE_PLACE_GAP = 1.15;
    /** 算/合：百十个同排时，位与位之间的横向间距 */
    const COMBINE_PLACE_GAP = 0.55;

    function placeUnitWidth(place) {
      if (place === 100) return 10 * BLOCK_SP;
      if (place === 1000) return 100 * BLOCK_SP;
      return BLOCK_SP;
    }

    /** 占位宽度（排布间距） */
    function placeGroupWidth(place, count, stackPile = false) {
      if (stackPile && count > 0 && (place === 100 || place === 1000)) return placeUnitWidth(place);
      return count * placeUnitWidth(place);
    }

    /** 两位数、三位数乘一位数：算/合时各组纵深叠放 */
    function isCombineGroupStack() {
      return numA >= 10 && numA <= 999;
    }

    /** 算/合：该位段横向占位（组纵深叠放时宽度不按组数展开） */
    function combinePlaceSegWidth(place, digit) {
      if (isCombineGroupStack()) {
        if (place === 1) return BLOCK_SP;
        return placeGroupWidth(place, digit);
      }
      if (place === 1) return numB * BLOCK_SP;
      return placeGroupWidth(place, digit * numB);
    }

    function decomposeExpr(n) {
      return getPlaceDigits(n)
        .filter((p) => p.digit > 0)
        .map((p) => String(p.digit * p.place))
        .reverse()
        .join(" + ");
    }

    function splitDescFromPlaces(places) {
      return [...places]
        .reverse()
        .filter((p) => p.digit > 0)
        .map((p) => (p.place === 1 ? `${p.digit} 个一` : `${p.digit} 个整${p.place}`))
        .join(" + ");
    }

    function getEquationPartials(n, b) {
      return getPlaceDigits(n)
        .filter((p) => p.digit > 0)
        .map((p) => ({
          term: p.digit * p.place,
          value: p.digit * p.place * b
        }));
    }

    function getEquationLineItems(step) {
      const product = numA * numB;
      const partials = getEquationPartials(numA, numB);
      const withResult = mode !== "calculate";
      const items = [];
      if (step >= 1) {
        items.push({
          cls: "main",
          text: withResult && step > 1 ? `${numA}×${numB}=${product}` : `${numA}×${numB}`
        });
      }
      if (step >= 2) {
        for (const p of partials) {
          items.push({
            cls: "partial",
            text: withResult ? `${p.term}×${numB}=${p.value}` : `${p.term}×${numB}`
          });
        }
      }
      if (step >= 3) {
        const sumExpr = [...partials].reverse().map((p) => p.value).join("+");
        items.push({ cls: "sum", text: `${sumExpr}=${product}` });
      }
      return items;
    }

    function isFormulaOnPanel(text, items) {
      return items.some((it) => it.text === text || it.text.startsWith(`${text}=`));
    }

    function renderEqPanel() {}

    function syncVisiblePileFormulas(formulas) {
      const key = formulas.join("\0");
      if (key === visiblePileFormulasKey) return;
      visiblePileFormulasKey = key;
      visiblePileFormulasList = formulas;
      renderEqPanel();
    }

    function setEqStep(step) {
      const prevStep = eqStep;
      eqStep = step;
      if (step < prevStep) {
        renderEqPanel();
        return;
      }
      renderEqPanel();
    }

    /** 合模式左下角公式 */
    function formatCombineFormula(n, b) {
      const product = n * b;
      const partials = getEquationPartials(n, b);
      const lines = [`${n}×${b}=${product}`];
      for (const p of partials) lines.push(`${p.term}×${b}=${p.value}`);
      const sumExpr = [...partials].reverse().map((p) => p.value).join("+");
      lines.push(`${sumExpr}=${product}`);
      return lines.join("<br>");
    }

    function estimateSegWidth(place, digit, stackPile = false) {
      if (place === 1) return BLOCK;
      if (stackPile && place === 100) return 9 * BLOCK_SP + BLOCK;
      if (place === 10) return (Math.max(1, digit) - 1) * BLOCK_SP + BLOCK;
      const uw = placeUnitWidth(place);
      return (digit - 1) * uw + BLOCK;
    }

    function groupInnerWidth(places, stackPile = false, placeGap = PLACE_GAP) {
      const active = [...places].reverse().filter((p) => p.digit > 0);
      let w = 0;
      active.forEach((p, i) => {
        w += estimateSegWidth(p.place, p.digit, stackPile);
        if (i < active.length - 1) w += placeGap;
      });
      return w;
    }

    /** 绘制一个 place 位值单元，返回占用宽度 */
    function drawPlaceUnit(seg, lx, lz, place, color) {
      if (place === 10) {
        for (let y = 0; y < 10; y++) addBlock(seg, lx, y, lz, color);
      } else if (place === 100) {
        for (let cx = 0; cx < 10; cx++) {
          for (let y = 0; y < 10; y++) addBlock(seg, lx + cx * BLOCK_SP, y, lz, color);
        }
      } else if (place === 1000) {
        for (let flat = 0; flat < 10; flat++) {
          const flatX = lx + flat * 10 * BLOCK_SP;
          for (let cx = 0; cx < 10; cx++) {
            for (let y = 0; y < 10; y++) addBlock(seg, flatX + cx * BLOCK_SP, y, lz, color);
          }
        }
      }
      return placeUnitWidth(place);
    }

    function drawPlaceGroup(seg, lx, lz, place, digit, color, stackPile = false) {
      if (stackPile && digit > 0 && place === 100) {
        for (let h = 0; h < digit; h++) {
          for (let cx = 0; cx < 10; cx++) {
            for (let y = 0; y < 10; y++) addBlock(seg, lx + cx * BLOCK_SP, y, lz + h * BLOCK_SP, color);
          }
        }
        return placeUnitWidth(place);
      }
      if (stackPile && digit > 0 && place === 1000) {
        for (let k = 0; k < digit; k++) {
          const zOff = lz + k * BLOCK_SP;
          for (let flat = 0; flat < 10; flat++) {
            const flatX = lx + flat * 10 * BLOCK_SP;
            for (let cx = 0; cx < 10; cx++) {
              for (let y = 0; y < 10; y++) addBlock(seg, flatX + cx * BLOCK_SP, y, zOff, color);
            }
          }
        }
        return placeUnitWidth(place);
      }
      let w = 0;
      for (let i = 0; i < digit; i++) {
        drawPlaceUnit(seg, lx + w, lz, place, color);
        w += placeUnitWidth(place);
      }
      return w;
    }

    function finishBuild(skipAnimate = true) {
      centerGroup();
      fitCameraToBlocks();
      updateHints();
    }

    function parseInputs() {
      numA = Math.min(MAX_NUM_A, Math.max(0, parseInt(valA.textContent, 10) || 0));
      numB = Math.min(9, Math.max(0, parseInt(valB.textContent, 10) || 0));
      valA.textContent = numA;
      valB.textContent = numB;
      const places = getPlaceDigits(numA);
      return { places, product: numA * numB };
    }

    function clearBlocks() {
      deselectSegment();
      for (const b of blocks) {
        b.mesh.geometry.dispose();
        b.mesh.material.dispose();
      }
      for (const seg of segments) blockGroup.remove(seg.threeGroup);
      blocks = [];
      segments = [];
      pileLabelsEl.innerHTML = "";
      visiblePileFormulasKey = "";
      visiblePileFormulasList = [];
    }

    function formulaForPlace(place, withResult = false) {
      const digit = Math.floor(numA / place) % 10;
      if (digit === 0) return null;
      const term = digit * place;
      if (withResult) return `${term}×${numB}=${term * numB}`;
      return `${term}×${numB}`;
    }

    function getCombineSumFormula() {
      const partials = getEquationPartials(numA, numB);
      const product = numA * numB;
      const sumExpr = [...partials].reverse().map((p) => p.value).join("+");
      return `${sumExpr}=${product}`;
    }

    function isPlaceClustered(segs) {
      if (segs.length < 2) return false;
      const centers = segs.map((s) => {
        const c = new THREE.Vector3();
        s.threeGroup.getWorldPosition(c);
        return c;
      });
      let maxDist = 0;
      for (let i = 0; i < centers.length; i++) {
        for (let j = i + 1; j < centers.length; j++) {
          maxDist = Math.max(
            maxDist,
            Math.hypot(centers[i].x - centers[j].x, centers[i].z - centers[j].z)
          );
        }
      }
      return maxDist < CLUSTER_MAX_DIST;
    }

    function shouldShowPlaceLabel(segs) {
      if (mode === "calculate" || mode === "combine") return segs.length > 0;
      return isPlaceClustered(segs);
    }

    function mountPileLabel(text, anchor, extraClass = "") {
      const screen = worldToScreen(anchor);
      if (screen.behind) return;
      const el = document.createElement("div");
      el.className = extraClass ? `pile-label ${extraClass}` : "pile-label";
      el.textContent = text;
      el.style.left = `${screen.x}px`;
      el.style.top = `${screen.y}px`;
      pileLabelsEl.appendChild(el);
    }

    function worldToScreen(worldPos) {
      _projVec.copy(worldPos).project(camera);
      const rect = renderer.domElement.getBoundingClientRect();
      return {
        x: rect.left + (_projVec.x * 0.5 + 0.5) * rect.width,
        y: rect.top + (-_projVec.y * 0.5 + 0.5) * rect.height,
        behind: _projVec.z > 1
      };
    }

    function updatePileLabels() {
      pileLabelsEl.innerHTML = "";
      if (!segments.length) {
        syncVisiblePileFormulas([]);
        return;
      }

      if (verticalGatheredPlaces.length) {
        const panelFormulas = [];
        [...verticalGatheredPlaces].sort((a, b) => b - a).forEach((place) => {
          const segs = segments.filter((s) => s.isGathered && s.place === place);
          if (!segs.length) return;
          const text = formulaForPlace(place, true);
          if (!text) return;
          panelFormulas.push(text);
          const box = new THREE.Box3();
          segs.forEach((s) => box.expandByObject(s.threeGroup));
          mountPileLabel(
            text,
            new THREE.Vector3(
              (box.min.x + box.max.x) / 2,
              box.min.y - 0.25,
              (box.min.z + box.max.z) / 2
            )
          );
        });
        syncVisiblePileFormulas(panelFormulas);
        return;
      }

      const byPlace = new Map();
      segments.forEach((seg) => {
        if (!byPlace.has(seg.place)) byPlace.set(seg.place, []);
        byPlace.get(seg.place).push(seg);
      });

      const panelFormulas = [];

      [...byPlace.entries()]
        .sort((a, b) => b[0] - a[0])
        .forEach(([place, segs]) => {
          if (!shouldShowPlaceLabel(segs)) return;
          const text = formulaForPlace(place, mode === "combine");
          if (!text) return;

          panelFormulas.push(text);

          const box = new THREE.Box3();
          segs.forEach((s) => box.expandByObject(s.threeGroup));
          const anchor = new THREE.Vector3(
            (box.min.x + box.max.x) / 2,
            box.min.y - 0.25,
            (box.min.z + box.max.z) / 2
          );
          mountPileLabel(text, anchor);
        });

      if (mode === "combine") {
        const box = new THREE.Box3().setFromObject(blockGroup);
        if (!box.isEmpty()) {
          const cx = (box.min.x + box.max.x) / 2;
          const cz = (box.min.z + box.max.z) / 2;
          const mainText = `${numA}×${numB}=${numA * numB}`;
          panelFormulas.unshift(mainText);
          mountPileLabel(
            mainText,
            new THREE.Vector3(cx, box.max.y + 0.5, cz),
            "main"
          );

          const partials = getEquationPartials(numA, numB);
          if (partials.length >= 2) {
            const sumText = getCombineSumFormula();
            panelFormulas.push(sumText);
            mountPileLabel(
              sumText,
              new THREE.Vector3(cx, box.min.y - 0.55, cz),
              "sum"
            );
          }
        }
      }

      syncVisiblePileFormulas(panelFormulas);
    }

    function createSegment(multIdx, place, isGathered = false) {
      const threeGroup = new THREE.Group();
      threeGroup.scale.set(1, 1, 1);
      blockGroup.add(threeGroup);
      const seg = { multIdx, place, threeGroup, meshes: [], isGathered };
      segments.push(seg);
      return seg;
    }

    function findSegmentFromObject(obj) {
      let o = obj;
      while (o) {
        const seg = segments.find((s) => s.threeGroup === o);
        if (seg) return seg;
        o = o.parent;
      }
      return null;
    }

    function highlightSegment(seg, on) {
      if (!seg) return;
      seg.meshes.forEach((m) => {
        m.material.emissive.setHex(on ? 0x4466aa : 0x000000);
        m.material.emissiveIntensity = on ? 0.28 : 0;
      });
    }

    function deselectSegment() {
      if (selectedSeg) highlightSegment(selectedSeg, false);
      selectedSeg = null;
      dragActive = false;
      controls.enabled = true;
      renderer.domElement.style.cursor = "";
    }

    function setMouseFromEvent(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    }

    /** 方块包围盒在相机横向（左右）上的投影宽度 */
    function getBlockHorizontalSpan(box) {
      _viewDir.copy(VIEW_OFFSET).negate().normalize();
      _camRight.crossVectors(_worldUp, _viewDir);
      if (_camRight.lengthSq() < 1e-8) _camRight.set(1, 0, 0);
      else _camRight.normalize();

      const xs = [box.min.x, box.max.x];
      const ys = [box.min.y, box.max.y];
      const zs = [box.min.z, box.max.z];
      let minR = Infinity;
      let maxR = -Infinity;
      for (let xi = 0; xi < 2; xi++) {
        for (let yi = 0; yi < 2; yi++) {
          for (let zi = 0; zi < 2; zi++) {
            _projVec.set(xs[xi], ys[yi], zs[zi]);
            const r = _projVec.dot(_camRight);
            if (r < minR) minR = r;
            if (r > maxR) maxR = r;
          }
        }
      }
      return Math.max(maxR - minR, 0.5);
    }

    function effectiveSpanForFit(spanH) {
      const h = Math.max(spanH, FIT_SPAN_MIN);
      if (h <= FIT_SPAN_REF) return h;
      return FIT_SPAN_REF + Math.pow(h - FIT_SPAN_REF, FIT_SPAN_GROWTH);
    }

    function fitCameraToBlocks() {
      const box = new THREE.Box3().setFromObject(blockGroup);
      if (box.isEmpty()) return;
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const spanH = getBlockHorizontalSpan(box);
      const spanFit = effectiveSpanForFit(spanH);
      const fovRad = (camera.fov * Math.PI) / 180;
      const hFov = 2 * Math.atan(Math.tan(fovRad / 2) * camera.aspect);
      let d = Math.max(spanFit / 2 / Math.tan(hFov / 2), 1) * FIT_MARGIN;
      d = Math.min(d, FIT_DIST_MAX);
      camera.position.set(
        center.x + VIEW_OFFSET.x * d,
        center.y + VIEW_OFFSET.y * d,
        center.z + VIEW_OFFSET.z * d
      );
      controls.target.set(center.x, Math.max(0.6, center.y), center.z);
      controls.minDistance = Math.max(2, d * 0.25);
      controls.maxDistance = Math.max(50, d * 4);
      scene.fog.near = d * 0.4;
      scene.fog.far = d * 4 + size.y * 2;
      camera.updateProjectionMatrix();
    }

    function makeBlock(color, emissive = 0) {
      const geo = new THREE.BoxGeometry(BLOCK * 0.92, BLOCK * 0.92, BLOCK * 0.92);
      const mat = new THREE.MeshStandardMaterial({
        color,
        emissive: new THREE.Color(emissive),
        emissiveIntensity: emissive ? 0.35 : 0,
        metalness: 0.15,
        roughness: 0.55
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
      );
      mesh.add(edges);
      return mesh;
    }

    function addBlock(seg, lx, y, lz, color, emissive = 0) {
      const mesh = makeBlock(color, emissive);
      mesh.position.set(lx, y * GAP + BLOCK / 2, lz * BLOCK_SP);
      seg.threeGroup.add(mesh);
      seg.meshes.push(mesh);
      blocks.push({ mesh, seg });
      return mesh;
    }

    /** 拆/合动画：提出与合并位移 */
    const EXTRACT_PULL_Z = 2.0;
    const EXTRACT_PULL_Y = 0.2;
    const GATHER_Z = 3.0;
    const GATHER_Y = 0.25;
    const GATHER_PLACE_GAP = 0.9;

    function measureSegWidth(seg) {
      let maxX = 0;
      seg.meshes.forEach((m) => {
        maxX = Math.max(maxX, m.position.x + BLOCK / 2);
      });
      return maxX;
    }

    const ANIM_DUR = 720;

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function animateGroupTo(group, target, dur = ANIM_DUR) {
      return new Promise((resolve) => {
        const from = { x: group.position.x, y: group.position.y, z: group.position.z };
        const start = performance.now();
        function tick(now) {
          const t = easeOutCubic(Math.min(1, (now - start) / dur));
          group.position.set(
            from.x + (target.x - from.x) * t,
            from.y + (target.y - from.y) * t,
            from.z + (target.z - from.z) * t
          );
          if (t < 1) requestAnimationFrame(tick);
          else resolve();
        }
        requestAnimationFrame(tick);
      });
    }

    function getDecomposePlaceSegments(place) {
      return segments.filter((s) => s.place === place && !s.isGathered && s.multIdx < 1000);
    }

    function ensureDecomposeLayout() {
      parseInputs();
      const ok = segments.some((s) => s.multIdx < numB && s.place > 0 && !s.isGathered);
      if (!segments.length || !ok) {
        mode = "decompose";
        buildDecompose();
      }
    }

    function computeGatherPileOriginX(targetPlace) {
      const sorted = [...verticalGatheredPlaces].sort((a, b) => b - a);
      let totalW = 0;
      sorted.forEach((pl, i) => {
        totalW += gatheredLayoutWidth(pl);
        if (i < sorted.length - 1) totalW += layoutGapAfter(pl);
      });
      let fx = -totalW / 2;
      for (const pl of sorted) {
        if (pl === targetPlace) return fx;
        fx += gatheredLayoutWidth(pl) + layoutGapAfter(pl);
      }
      return 0;
    }

    function getGatheredSegments(place) {
      return segments.filter((s) => s.isGathered && s.place === place);
    }

    function gatheredLayoutWidth(place) {
      const segs = getGatheredSegments(place);
      const digit = Math.floor(numA / place) % 10;
      const fallback = combinePlaceSegWidth(place, digit);
      if (!segs.length) return fallback;
      return Math.max(fallback, ...segs.map((s) => measureSegWidth(s)));
    }

    function layoutGapAfter(place) {
      if (place >= 1000) return GATHER_PLACE_GAP * 2.8;
      if (place >= 100) return GATHER_PLACE_GAP * 2.2;
      return GATHER_PLACE_GAP;
    }

    /** 合并后各数位仅横向错开，同一纵深 */
    function gatherPositionForPlace(fx) {
      return { x: fx, y: GATHER_Y, z: GATHER_Z };
    }

    function layoutAllGatheredPiles(animate = false) {
      parseInputs();
      const sorted = [...verticalGatheredPlaces].sort((a, b) => b - a);
      if (!sorted.length) return Promise.resolve();

      let totalW = 0;
      sorted.forEach((pl, i) => {
        totalW += gatheredLayoutWidth(pl);
        if (i < sorted.length - 1) totalW += layoutGapAfter(pl);
      });

      let fx = -totalW / 2;
      const tasks = [];
      sorted.forEach((pl, idx) => {
        const pos = gatherPositionForPlace(fx);
        getGatheredSegments(pl).forEach((seg) => {
          if (animate) tasks.push(animateGroupTo(seg.threeGroup, pos));
          else seg.threeGroup.position.set(pos.x, pos.y, pos.z);
        });
        fx += gatheredLayoutWidth(pl);
        if (idx < sorted.length - 1) fx += layoutGapAfter(pl);
      });

      centerGroup();
      fitCameraToBlocks();
      return Promise.all(tasks);
    }

    function highlightExtractSeg(seg) {
      seg.meshes.forEach((m) => {
        m.material.emissive.setHex(0x335577);
        m.material.emissiveIntensity = 0.22;
      });
    }

    function highlightGatherSeg(seg) {
      seg.meshes.forEach((m) => {
        m.material.emissive.setHex(0x2e6b48);
        m.material.emissiveIntensity = 0.2;
      });
    }

    function removeSegmentFromScene(seg) {
      blockGroup.remove(seg.threeGroup);
      const idx = segments.indexOf(seg);
      if (idx >= 0) segments.splice(idx, 1);
      blocks = blocks.filter((b) => b.seg !== seg);
    }

    function finalizeGatherMerge(targetPlace) {
      const srcSegs = getDecomposePlaceSegments(targetPlace);
      if (!srcSegs.length) return null;
      const digit = Math.floor(numA / targetPlace) % 10;

      let gathered;
      if (srcSegs.length === 1) {
        gathered = srcSegs[0];
      } else {
        gathered = createSegment(1000 + targetPlace, targetPlace, true);
        const meshByGroup = [];
        srcSegs.sort((a, b) => a.multIdx - b.multIdx).forEach((seg) => {
          const list = [...seg.meshes];
          list.forEach((m) => seg.threeGroup.remove(m));
          meshByGroup.push({ g: seg.multIdx, meshes: list });
          removeSegmentFromScene(seg);
        });

        meshByGroup.sort((a, b) => a.g - b.g).forEach(({ g, meshes }) => {
          copyMeshesIntoGathered(gathered, targetPlace, digit, g, meshes);
        });
      }

      gathered.isGathered = true;
      highlightGatherSeg(gathered);
      return gathered;
    }

    function copyMeshesIntoGathered(gathered, place, digit, g, meshes) {
      const stackGroups = isCombineGroupStack();
      const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
      const temp = createSegment(-999, place);

      if (place === 1) {
        meshes.forEach((mesh, y) => {
          gathered.threeGroup.add(mesh);
          gathered.meshes.push(mesh);
          blocks.push({ mesh, seg: gathered });
          if (stackGroups) mesh.position.set(0, y * GAP + BLOCK / 2, g * BLOCK_SP);
          else mesh.position.set(g * BLOCK_SP, y * GAP + BLOCK / 2, 0);
        });
      } else {
        drawPlaceGroup(temp, 0, g, place, digit, colColor, false);
        temp.meshes.forEach((tm, i) => {
          if (!meshes[i]) return;
          meshes[i].position.copy(tm.position);
          gathered.threeGroup.add(meshes[i]);
          gathered.meshes.push(meshes[i]);
          blocks.push({ mesh: meshes[i], seg: gathered });
        });
      }
      removeSegmentFromScene(temp);
    }

    async function animateExtractPlace(targetPlace) {
      parseInputs();
      ensureDecomposeLayout();
      const segs = getDecomposePlaceSegments(targetPlace);
      if (!segs.length) {
        buildPlaceSplit(targetPlace);
        return;
      }

      await Promise.all(
        segs.map((seg) => {
          if (seg.threeGroup.position.z >= EXTRACT_PULL_Z - 0.05) return Promise.resolve();
          highlightExtractSeg(seg);
          return animateGroupTo(seg.threeGroup, {
            x: seg.threeGroup.position.x,
            y: EXTRACT_PULL_Y,
            z: EXTRACT_PULL_Z
          });
        })
      );
      centerGroup();
      fitCameraToBlocks();
    }

    async function animateGatherPlace(targetPlace) {
      parseInputs();
      if (!verticalGatheredPlaces.includes(targetPlace)) verticalGatheredPlaces.push(targetPlace);
      verticalGatheredPlaces.sort((a, b) => b - a);

      const segs = getDecomposePlaceSegments(targetPlace);
      if (!segs.length) {
        buildVerticalGatherScene();
        return;
      }

      const pileX = computeGatherPileOriginX(targetPlace);
      const prePos = gatherPositionForPlace(pileX);
      await Promise.all(segs.map((seg) => animateGroupTo(seg.threeGroup, prePos)));

      finalizeGatherMerge(targetPlace);
      await layoutAllGatheredPiles(true);
    }

    function animateIn() {
      blocks.forEach((b) => b.mesh.scale.setScalar(1));
    }

  /** 拆：按各位数拆成整1/整10/整100/整1000 列，组内同色 */
    function buildDecompose() {
      clearBlocks();
      const { places } = parseInputs();
      const groups = numB;
      const groupInnerW = groupInnerWidth(places, true, DECOMPOSE_PLACE_GAP);
      const groupW = groupInnerW + 1.3;
      const startX = -((groups - 1) * groupW) / 2;

      for (let g = 0; g < groups; g++) {
        const gx = startX + g * groupW;
        const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
        let x = gx - groupInnerW / 2;
        const activePlaces = [...places].reverse().filter((p) => p.digit > 0);

        activePlaces.forEach((p, i) => {
          const { place, digit } = p;
          const seg = createSegment(g, place);
          seg.threeGroup.position.set(x, 0, 0);
          if (place === 1) {
            for (let y = 0; y < digit; y++) addBlock(seg, 0, y, 0, colColor);
          } else {
            drawPlaceGroup(seg, 0, 0, place, digit, colColor, true);
          }
          if (i < activePlaces.length - 1) x += measureSegWidth(seg) + DECOMPOSE_PLACE_GAP;
          else x += measureSegWidth(seg);
        });
      }

      finishBuild();
    }

  /** 分模式：乘数份，每组一整列（未拆），组内同色 */
    function buildMultiply() {
      clearBlocks();
      const groups = numB;
      const groupW = 1.15;
      const startX = -((groups - 1) * groupW) / 2;

      for (let g = 0; g < groups; g++) {
        const gx = startX + g * groupW;
        const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
        const seg = createSegment(g, 0);
        seg.threeGroup.position.set(gx, 0, 0);
        for (let y = 0; y < numA; y++) addBlock(seg, 0, y, 0, colColor);
      }

      finishBuild();
    }

  /** 合/算：各位乘积同排横向排列，位与位之间留间距 */
    function buildCombine(skipAnimate = false) {
      clearBlocks();
      const { places } = parseInputs();
      const activePlaces = [...places].reverse().filter((p) => p.digit > 0);

      const stackGroups = isCombineGroupStack();

      let totalW = 0;
      activePlaces.forEach((p, i) => {
        totalW += combinePlaceSegWidth(p.place, p.digit);
        const next = activePlaces[i + 1];
        if (next) totalW += COMBINE_PLACE_GAP;
      });

      let x = -totalW / 2;
      activePlaces.forEach((p, i) => {
        const { place, digit } = p;
        const seg = createSegment(0, place);
        seg.threeGroup.position.set(x, 0, 0);
        if (place === 1) {
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            if (stackGroups) {
              for (let y = 0; y < digit; y++) addBlock(seg, 0, y, g, colColor);
            } else {
              for (let y = 0; y < digit; y++) addBlock(seg, g * BLOCK_SP, y, 0, colColor);
            }
          }
        } else if (stackGroups) {
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            drawPlaceGroup(seg, 0, g, place, digit, colColor, false);
          }
        } else {
          let lx = 0;
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            for (let d = 0; d < digit; d++) {
              drawPlaceUnit(seg, lx, 0, place, colColor);
              lx += placeUnitWidth(place);
            }
          }
        }
        const next = activePlaces[i + 1];
        if (next) x += measureSegWidth(seg) + COMBINE_PLACE_GAP;
        else x += measureSegWidth(seg);
      });

      finishBuild(skipAnimate);
    }

    /** 拆某一数位：其余位保持原位，仅将该位积木向前提出（无场景时静态构建） */
    function buildPlaceSplit(targetPlace) {
      clearBlocks();
      const { places } = parseInputs();
      const targetDigit = Math.floor(numA / targetPlace) % 10;
      if (targetDigit === 0) {
        finishBuild();
        return;
      }

      const groups = numB;
      const groupInnerW = groupInnerWidth(places, true, DECOMPOSE_PLACE_GAP);
      const groupW = groupInnerW + 1.3;
      const startX = -((groups - 1) * groupW) / 2;
      const activePlaces = [...places].reverse().filter((p) => p.digit > 0);

      for (let g = 0; g < groups; g++) {
        const gx = startX + g * groupW;
        const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
        let x = gx - groupInnerW / 2;

        activePlaces.forEach((p, i) => {
          const { place, digit } = p;
          const seg = createSegment(g, place);
          const isExtract = place === targetPlace;
          seg.threeGroup.position.set(x, isExtract ? EXTRACT_PULL_Y : 0, isExtract ? EXTRACT_PULL_Z : 0);
          if (place === 1) {
            for (let y = 0; y < digit; y++) addBlock(seg, 0, y, 0, colColor);
          } else {
            drawPlaceGroup(seg, 0, 0, place, digit, colColor, true);
          }
          if (isExtract) {
            seg.meshes.forEach((m) => {
              m.material.emissive.setHex(0x335577);
              m.material.emissiveIntensity = 0.22;
            });
          }
          if (i < activePlaces.length - 1) x += measureSegWidth(seg) + DECOMPOSE_PLACE_GAP;
          else x += measureSegWidth(seg);
        });
      }

      finishBuild();
    }

    /** 竖式：背景保留未合并的位，前景合并已提出的位（无动画时的静态构建） */
    function buildVerticalGatherScene() {
      clearBlocks();
      const { places } = parseInputs();
      const activePlaces = [...places].reverse().filter((p) => p.digit > 0);
      const bgPlaces = activePlaces.filter((p) => !verticalGatheredPlaces.includes(p.place));
      const groups = numB;
      const stackGroups = isCombineGroupStack();

      if (bgPlaces.length) {
        let bgInnerW = 0;
        bgPlaces.forEach((p, i) => {
          bgInnerW += estimateSegWidth(p.place, p.digit, true);
          if (i < bgPlaces.length - 1) bgInnerW += DECOMPOSE_PLACE_GAP;
        });
        const groupW = bgInnerW + 1.3;
        const startX = -((groups - 1) * groupW) / 2;

        for (let g = 0; g < groups; g++) {
          const gx = startX + g * groupW;
          const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
          let x = gx - bgInnerW / 2;
          bgPlaces.forEach((p, i) => {
            const { place, digit } = p;
            const seg = createSegment(g, place);
            seg.threeGroup.position.set(x, 0, 0);
            if (place === 1) {
              for (let y = 0; y < digit; y++) addBlock(seg, 0, y, 0, colColor);
            } else {
              drawPlaceGroup(seg, 0, 0, place, digit, colColor, true);
            }
            if (i < bgPlaces.length - 1) x += measureSegWidth(seg) + DECOMPOSE_PLACE_GAP;
            else x += measureSegWidth(seg);
          });
        }
      }

      const sortedGathered = [...verticalGatheredPlaces].sort((a, b) => b - a);
      let fgTotalW = 0;
      sortedGathered.forEach((place, i) => {
        fgTotalW += combinePlaceSegWidth(place, Math.floor(numA / place) % 10);
        if (i < sortedGathered.length - 1) fgTotalW += layoutGapAfter(place);
      });

      let fx = -fgTotalW / 2;
      sortedGathered.forEach((place, idx) => {
        const digit = Math.floor(numA / place) % 10;
        if (digit === 0) return;
        const seg = createSegment(1000 + place, place, true);
        const pos = gatherPositionForPlace(fx);
        seg.threeGroup.position.set(pos.x, pos.y, pos.z);

        if (place === 1) {
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            if (stackGroups) {
              for (let y = 0; y < digit; y++) addBlock(seg, 0, y, g, colColor);
            } else {
              for (let y = 0; y < digit; y++) addBlock(seg, g * BLOCK_SP, y, 0, colColor);
            }
          }
        } else if (stackGroups) {
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            drawPlaceGroup(seg, 0, g, place, digit, colColor, false);
          }
        } else {
          let lx = 0;
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            for (let d = 0; d < digit; d++) {
              drawPlaceUnit(seg, lx, 0, place, colColor);
              lx += placeUnitWidth(place);
            }
          }
        }

        seg.meshes.forEach((m) => {
          m.material.emissive.setHex(0x2e6b48);
          m.material.emissiveIntensity = 0.2;
        });

        fx += Math.max(combinePlaceSegWidth(place, digit), measureSegWidth(seg));
        if (idx < sortedGathered.length - 1) fx += layoutGapAfter(place);
      });

      finishBuild(true);
    }

    /** 仅合并指定数位的乘积（按钮算模式用） */
    function buildPlacesCombine(includePlaces, skipAnimate = false) {
      clearBlocks();
      const { places } = parseInputs();
      const placeSet = new Set(includePlaces);
      const activePlaces = [...places].reverse().filter((p) => p.digit > 0 && placeSet.has(p.place));
      if (!activePlaces.length) {
        finishBuild(skipAnimate);
        return;
      }

      const stackGroups = isCombineGroupStack();
      let totalW = 0;
      activePlaces.forEach((p, i) => {
        totalW += combinePlaceSegWidth(p.place, p.digit);
        if (activePlaces[i + 1]) totalW += COMBINE_PLACE_GAP;
      });

      let x = -totalW / 2;
      activePlaces.forEach((p, i) => {
        const { place, digit } = p;
        const seg = createSegment(0, place);
        seg.threeGroup.position.set(x, 0, 0);
        if (place === 1) {
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            if (stackGroups) {
              for (let y = 0; y < digit; y++) addBlock(seg, 0, y, g, colColor);
            } else {
              for (let y = 0; y < digit; y++) addBlock(seg, g * BLOCK_SP, y, 0, colColor);
            }
          }
        } else if (stackGroups) {
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            drawPlaceGroup(seg, 0, g, place, digit, colColor, false);
          }
        } else {
          let lx = 0;
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            for (let d = 0; d < digit; d++) {
              drawPlaceUnit(seg, lx, 0, place, colColor);
              lx += placeUnitWidth(place);
            }
          }
        }
        const next = activePlaces[i + 1];
        if (next) x += measureSegWidth(seg) + COMBINE_PLACE_GAP;
        else x += measureSegWidth(seg);
      });

      finishBuild(skipAnimate);
    }

    function placeLabel(place) {
      if (place === 1) return "个位";
      if (place === 10) return "十位";
      if (place === 100) return "百位";
      return "千位";
    }

    function centerGroup() {
      const box = new THREE.Box3().setFromObject(blockGroup);
      if (box.isEmpty()) return;
      const c = box.getCenter(new THREE.Vector3());
      blockGroup.position.x = -c.x;
      blockGroup.position.z = -c.z;
    }

    function updateHints() {
      const { places, product } = parseInputs();
      const expr = decomposeExpr(numA);
      const splitDesc = splitDescFromPlaces(places);

      if (mode === "decompose") {
        hintBottom.innerHTML = `<strong>当前算式：</strong> ${numA} × ${numB} = ${product}<br>${numA} = ${expr}，共 ${numB} 组<br><span style="opacity:0.85">分模式：每组按百→十→个排列，${splitDesc}</span>`;
      } else if (mode === "calculate") {
        hintBottom.innerHTML = `<strong>分步计算：</strong><br>${formatCombineFormula(numA, numB)}`;
      } else if (mode === "multiply") {
        hintBottom.innerHTML = `<strong>当前算式：</strong> ${numA} × ${numB} = ${product}<br><span style="opacity:0.85">分模式：${numB} 组，每组 ${numA} 个方块一列</span>`;
      } else {
        hintBottom.innerHTML = `<strong>乘积模式：</strong><br>${formatCombineFormula(numA, numB)}<br><span style="opacity:0.85">合模式：各位乘积合并（${splitDesc}）× ${numB}</span>`;
      }
    }

    function rebuild() {
      blockGroup.position.set(0, 0, 0);
      if (mode === "decompose") buildDecompose();
      else if (mode === "combine" || mode === "calculate") buildCombine();
      else buildMultiply();
    }

    function resize() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      if (blocks.length) fitCameraToBlocks();
      if (typeof resizeVerticalCanvas === "function") resizeVerticalCanvas();
    }

    function onPointerDown(e) {
      if (e.button !== 0 || keypadWrap.classList.contains("show")) return;
      setMouseFromEvent(e);
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(segments.flatMap((s) => s.meshes), false);
      if (!hits.length) {
        deselectSegment();
        return;
      }
      const seg = findSegmentFromObject(hits[0].object);
      if (!seg) return;
      if (selectedSeg && selectedSeg !== seg) highlightSegment(selectedSeg, false);
      selectedSeg = seg;
      dragActive = true;
      controls.enabled = false;
      highlightSegment(selectedSeg, true);
      raycaster.ray.intersectPlane(dragPlane, dragHit);
      dragOffset.copy(dragHit).sub(selectedSeg.threeGroup.position);
      renderer.domElement.style.cursor = "grabbing";
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!dragActive || !selectedSeg) return;
      setMouseFromEvent(e);
      raycaster.setFromCamera(mouse, camera);
      if (!raycaster.ray.intersectPlane(dragPlane, dragHit)) return;
      selectedSeg.threeGroup.position.x = dragHit.x - dragOffset.x;
      selectedSeg.threeGroup.position.z = dragHit.z - dragOffset.z;
      updatePileLabels();
    }

    function onPointerUp() {
      if (dragActive) {
        dragActive = false;
        controls.enabled = true;
        renderer.domElement.style.cursor = selectedSeg ? "grab" : "";
      }
      updatePileLabels();
    }

    renderer.domElement.addEventListener("pointerdown", onPointerDown);
    renderer.domElement.addEventListener("pointermove", onPointerMove);
    renderer.domElement.addEventListener("pointerup", onPointerUp);
    renderer.domElement.addEventListener("pointerleave", onPointerUp);

    function loop() {
      requestAnimationFrame(loop);
      controls.update();
      updatePileLabels();
      renderer.render(scene, camera);
    }

    /* 数字键盘 */
    const keys = ["1","2","3","4","5","6","7","8","9","00","0"];
    keys.forEach((k) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "key";
      btn.textContent = k;
      btn.addEventListener("click", () => {
        const maxLen = keypadTarget === "a" ? 4 : 1;
        if (keypadTarget === "b" && k === "00") return;
        if (k === "00" && keypadBuffer.length > 0) return;
        if (keypadBuffer.length >= maxLen) return;
        if (k === "00" && keypadBuffer.length + 2 > maxLen) return;
        keypadBuffer += k;
        syncKeypadDisplay();
        refreshKeypadHighlight();
      });
      keypadGrid.appendChild(btn);
    });

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "key key-del";
    delBtn.textContent = "⌫";
    delBtn.addEventListener("click", () => {
      keypadBuffer = keypadBuffer.slice(0, -1);
      syncKeypadDisplay();
      refreshKeypadHighlight();
    });
    keypadGrid.appendChild(delBtn);

    const closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.className = "key key-close";
    closeBtn.textContent = "✕";
    closeBtn.addEventListener("click", () => closeKeypad(true));
    keypadGrid.appendChild(closeBtn);

    const okBtn = document.createElement("button");
    okBtn.type = "button";
    okBtn.className = "key key-ok";
    okBtn.textContent = "✓";
    okBtn.addEventListener("click", confirmKeypad);
    keypadGrid.appendChild(okBtn);

    function refreshKeypadHighlight() {
      keypadGrid.querySelectorAll(".key").forEach((el) => el.classList.remove("highlight"));
    }

    function syncKeypadDisplay() {
      const setVal = (el, text) => {
        if (text === "") {
          el.textContent = "";
          el.classList.add("empty");
        } else {
          el.textContent = text;
          el.classList.remove("empty");
        }
      };
      if (keypadTarget === "a") setVal(valA, keypadBuffer);
      else if (keypadTarget === "b") setVal(valB, keypadBuffer);
    }

    function restorePanelValues() {
      valA.textContent = numA;
      valB.textContent = numB;
      valA.classList.remove("empty");
      valB.classList.remove("empty");
    }

    function openKeypad(target) {
      keypadTarget = target;
      keypadBuffer = target === "a" ? String(numA) : String(numB);
      valA.classList.toggle("active", target === "a");
      valB.classList.toggle("active", target === "b");
      syncKeypadDisplay();
      keypadWrap.classList.add("show");
      refreshKeypadHighlight();
    }

    function closeKeypad(revert = true) {
      keypadWrap.classList.remove("show");
      valA.classList.remove("active");
      valB.classList.remove("active");
      if (revert) restorePanelValues();
      keypadTarget = null;
      keypadBuffer = "";
    }

    function confirmKeypad() {
      let v = parseInt(keypadBuffer, 10);
      if (isNaN(v) || keypadBuffer === "") v = keypadTarget === "a" ? 24 : 2;
      if (keypadTarget === "a") {
        v = Math.min(MAX_NUM_A, Math.max(0, v));
        numA = v;
        valA.textContent = v;
        valA.classList.remove("empty");
      } else {
        v = Math.min(9, Math.max(0, v));
        numB = v;
        valB.textContent = v;
        valB.classList.remove("empty");
      }
      closeKeypad(false);
      if (typeof syncVerticalFromNumbers === "function") {
        resetVerticalGather();
        syncVerticalFromNumbers();
        mode = "decompose";
        setEqStep(1);
        rebuild();
      }
    }

    valA.addEventListener("click", () => openKeypad("a"));
    valB.addEventListener("click", () => openKeypad("b"));
    keypadWrap.addEventListener("click", (e) => { if (e.target === keypadWrap) closeKeypad(true); });

    document.getElementById("btnGen").addEventListener("click", () => {
      parseInputs();
      resetVerticalGather();

      syncVerticalFromNumbers();

    });
    document.getElementById("btnSplit").addEventListener("click", () => {
      parseInputs();
      mode = "decompose";
      rebuild();
    });
    document.getElementById("btnCalc").addEventListener("click", () => {
      parseInputs();
      mode = "calculate";
      setEqStep(Math.max(eqStep, 2));
      buildCombine();
    });
    document.getElementById("btnCombine").addEventListener("click", () => {
      parseInputs();
      const prevMode = mode;
      mode = "combine";
      setEqStep(3);
      if (blocks.length && (prevMode === "calculate" || prevMode === "combine")) {
        updateHints();
        updatePileLabels();
        return;
      }
      buildCombine(true);
    });

    /* ========== 竖式乘法 + 个位自动拆合 ========== */
    const sheet = document.getElementById("sheet");
    const writeCanvas = document.getElementById("writeCanvas");
    const digitsLayer = document.getElementById("digitsLayer");
    const vEquations = document.getElementById("vEquations");
    const vResetBtn = document.getElementById("vResetBtn");
    const vNextBtn = document.getElementById("vNextBtn");
    const V_PROBLEMS = [
      { a: 24, b: 2 },
      { a: 16, b: 3 },
      { a: 24, b: 9 },
      { a: 0, b: 7 },
      { a: 7, b: 0 },
      { a: 604, b: 8 },
      { a: 280, b: 3 }
    ];
    let vProblemIndex = 0;
    const vCtx = writeCanvas.getContext("2d");
    const vStrokes = [];
    let vDrawing = false;
    let vLivePoints = [];
    let vWriteCounts = {};
    let vOnesShown = false;
    let vTensShown = false;
    let vFinalShown = false;
    let vDividerEl = null;
    let vSlotEls = {};
    let verticalFlowRunning = false;

    const V_MIN_STROKE = 14;
    const V_MIN_POINTS = 4;
    const V_ARROW_MIN = 10;
    const V_NEAR_ABOVE = 44;
    const V_INK = "#1a237e";
    const V_ARROW = "#c62828";
    const V_DIGIT_FONT = 'bold 2rem "KaiTi", "STKaiti", "楷体", serif';
    const V_CARRY_FONT = 'bold 1.1rem "KaiTi", "STKaiti", "楷体", serif';
    const V_ZONE_NAMES = ["ones", "tens", "hundreds", "thousands"];
    const V_ZONE_TO_PLACE = { ones: 1, tens: 10, hundreds: 100, thousands: 1000 };

    function getResultZones(productLen) {
      const zones = [];
      for (let i = productLen - 1; i >= 0; i--) zones.push(V_ZONE_NAMES[i]);
      return zones;
    }

    function getExpectedCarries() {
      const placeToZone = { 1: "ones", 10: "tens", 100: "hundreds", 1000: "thousands" };
      const carries = [];
      let carry = 0;
      for (let i = 0; i < PLACES.length; i++) {
        const place = PLACES[i];
        const digit = Math.floor(numA / place) % 10;
        const sum = digit * numB + carry;
        carry = Math.floor(sum / 10);
        if (carry > 0 && i + 1 < PLACES.length) {
          const nextPlace = PLACES[i + 1];
          carries.push({ column: placeToZone[nextPlace], digit: String(carry) });
        }
      }
      return carries;
    }

    function getExpectedCarryForColumn(column) {
      const hit = getExpectedCarries().find((c) => c.column === column);
      return hit ? hit.digit : null;
    }

    function getVerticalMeta() {
      const a = numA;
      const b = numB;
      const product = a * b;
      const pStr = String(product);
      const resultZones = getResultZones(pStr.length);
      const answerDigits = {};
      resultZones.forEach((z, i) => {
        answerDigits[z] = pStr[i];
      });
      const onesA = a % 10;
      const partials = getEquationPartials(a, b);
      const onesPartial = partials.find((p) => p.term === onesA || (p.term < 10 && p.term === onesA))
        || { term: onesA, value: onesA * b };
      const onesVal = onesPartial.value;
      const tensTerm = partials.find((p) => p.term >= 10 && p.term % 10 === 0);
      const tensEq1 = tensTerm ? `${tensTerm.term}×${b}=${tensTerm.value}` : null;
      const sumExpr = [...partials].reverse().map((p) => p.value).join("+");
      const expectedCarries = getExpectedCarries();
      return {
        aStr: String(a),
        bStr: String(b),
        product,
        pStr,
        resultZones,
        answerDigits,
        expectedCarries,
        onesAnswer: answerDigits.ones,
        tensAnswer: answerDigits.tens,
        hundredsAnswer: answerDigits.hundreds,
        thousandsAnswer: answerDigits.thousands,
        onesEq: `${onesA}×${b}=${onesVal}`,
        tensEq1,
        tensEq2: `${sumExpr}=${product}`,
        hasHundreds: product >= 100,
        hasThousands: product >= 1000,
        strokesForZone(zone) {
          const ans = answerDigits[zone];
          return ans ? ans.length : 1;
        }
      };
    }

    function slotIdForZone(zone) {
      return "slot" + zone.charAt(0).toUpperCase() + zone.slice(1);
    }

    function renderVerticalDigits() {
      const meta = getVerticalMeta();
      const aDigits = meta.aStr.split("");
      const pLen = meta.pStr.length;
      const cols = Math.max(aDigits.length, pLen);
      const pad = (n) => Array(Math.max(0, cols - n)).fill('<span class="placeholder"></span>').join("");
      const slots = meta.resultZones.map(
        (z) => `<span class="digit-slot" data-col="${z}" id="${slotIdForZone(z)}"></span>`
      );
      digitsLayer.innerHTML = `
        <div class="v-row">${pad(aDigits.length)}${aDigits.map((d) => `<span class="digit">${d}</span>`).join("")}</div>
        <div class="v-row v-row-multiply"><span class="operator">×</span>${pad(1)}<span class="digit" id="multiplierDigit">${meta.bStr}</span></div>
        <div class="v-divider" id="vDivider"></div>
        <div class="v-row result-row">${pad(slots.length)}${slots.join("")}</div>`;
      vDividerEl = document.getElementById("vDivider");
      vSlotEls = {};
      meta.resultZones.forEach((z) => {
        vSlotEls[z] = document.getElementById(slotIdForZone(z));
      });
      resetVerticalSheet(false);
      resizeVerticalCanvas();
    }

    function delay(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    /** 竖式独立：提出 → 合并 → 算式标签（不改动拆/算/合按钮状态） */
    async function verticalExtractPlace(place) {
      await animateExtractPlace(place);
    }

    async function verticalGatherPlace(place) {
      await animateGatherPlace(place);
    }

    async function verticalPlaceFlow(place) {
      if (verticalFlowRunning) return;
      verticalFlowRunning = true;
      await verticalExtractPlace(place);
      await delay(180);
      await verticalGatherPlace(place);
      verticalFlowRunning = false;
    }

    function resetVerticalGather() {
      verticalGatheredPlaces = [];
    }

    function syncVerticalFromNumbers() {
      renderVerticalDigits();
    }

    function applyVerticalProblem() {
      const p = V_PROBLEMS[vProblemIndex];
      numA = p.a;
      numB = p.b;
      valA.textContent = numA;
      valB.textContent = numB;
      valA.classList.remove("empty");
      valB.classList.remove("empty");
      resetVerticalGather();
      syncVerticalFromNumbers();
      mode = "decompose";
      setEqStep(1);
      rebuild();
    }

    function nextVerticalProblem() {
      vProblemIndex = (vProblemIndex + 1) % V_PROBLEMS.length;
      applyVerticalProblem();
    }

    function resizeVerticalCanvas() {
      if (!sheet) return;
      const rect = sheet.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      writeCanvas.width = rect.width * dpr;
      writeCanvas.height = rect.height * dpr;
      writeCanvas.style.width = rect.width + "px";
      writeCanvas.style.height = rect.height + "px";
      vCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redrawVertical();
    }

    function getVerticalZones() {
      const sheetRect = sheet.getBoundingClientRect();
      const divRect = vDividerEl.getBoundingClientRect();
      const zones = { resultTop: divRect.bottom - sheetRect.top };
      for (const [zone, el] of Object.entries(vSlotEls)) {
        if (!el || el.hidden) continue;
        const r = el.getBoundingClientRect();
        zones[zone] = { left: r.left - sheetRect.left, right: r.right - sheetRect.left };
      }
      return zones;
    }

    function vGetColumnAtX(cx, zones) {
      for (let i = V_ZONE_NAMES.length - 1; i >= 0; i--) {
        const z = V_ZONE_NAMES[i];
        if (zones[z] && cx >= zones[z].left && cx <= zones[z].right) return z;
      }
      return null;
    }

    function multiplyArrowSequence() {
      const len = String(numA).length;
      return V_ZONE_NAMES.slice(0, len);
    }

    function arrowTargetForNewStroke() {
      const above = vStrokes.filter((s) => s.type === "above");
      const seq = multiplyArrowSequence();
      return seq[above.length] || seq[seq.length - 1];
    }

    function vStrokeLen(pts) {
      let len = 0;
      for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      return len;
    }

    function vClassifyStroke(pts, zones) {
      if (pts.length < V_MIN_POINTS || vStrokeLen(pts) < V_MIN_STROKE) return null;
      let sumX = 0, sumY = 0, below = 0;
      for (const p of pts) {
        sumX += p.x; sumY += p.y;
        if (p.y >= zones.resultTop) below++;
      }
      const cx = sumX / pts.length;
      const cy = sumY / pts.length;
      const col = vGetColumnAtX(cx, zones);
      const mostlyBelow = below >= pts.length * 0.5;
      const nearAbove = cy >= zones.resultTop - V_NEAR_ABOVE && cy < zones.resultTop;
      if (col && mostlyBelow) return { type: "below", zone: col };
      if (nearAbove && !mostlyBelow) {
        const column = vGetColumnAtX(cx, zones);
        if (column) {
          const digit = getExpectedCarryForColumn(column);
          if (digit) {
            const snapX = (zones[column].left + zones[column].right) / 2;
            return { type: "nearAbove", digit, x: snapX, y: cy, carry: true, column };
          }
        }
        return { type: "free", points: pts.slice() };
      }
      if (below < pts.length * 0.5 && !nearAbove) {
        const p0 = pts[0], p1 = pts[pts.length - 1];
        return { type: "above", x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y, len: vStrokeLen(pts) };
      }
      return null;
    }

    function vBuildArrow(target) {
      const multEl = document.getElementById("multiplierDigit");
      const sheetRect = sheet.getBoundingClientRect();
      const mRect = multEl.getBoundingClientRect();
      const start = { x: (mRect.left + mRect.right) / 2 - sheetRect.left, y: mRect.top - sheetRect.top };
      const topRow = digitsLayer.querySelector(".v-row:first-child");
      const digitEls = topRow.querySelectorAll(".digit");
      const zoneOffset = { ones: 0, tens: 1, hundreds: 2, thousands: 3 };
      const idx = digitEls.length - 1 - (zoneOffset[target] || 0);
      const endEl = digitEls[Math.max(0, idx)] || digitEls[digitEls.length - 1];
      const eRect = endEl.getBoundingClientRect();
      const end = { x: (eRect.left + eRect.right) / 2 - sheetRect.left, y: eRect.bottom - sheetRect.top };
      return { type: "above", target, corrected: true, x1: start.x, y1: start.y, x2: end.x, y2: end.y, len: Math.hypot(end.x - start.x, end.y - start.y) };
    }

    function vDrawPath(pts, color, width) {
      if (pts.length < 2) return;
      vCtx.strokeStyle = color;
      vCtx.lineWidth = width;
      vCtx.lineCap = "round";
      vCtx.lineJoin = "round";
      vCtx.beginPath();
      vCtx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) vCtx.lineTo(pts[i].x, pts[i].y);
      vCtx.stroke();
    }

    function vDrawArrow(stroke) {
      const { x1, y1, x2, y2, len } = stroke;
      vCtx.strokeStyle = V_ARROW;
      vCtx.fillStyle = V_ARROW;
      vCtx.lineWidth = 2.5;
      vCtx.lineCap = "round";
      vCtx.beginPath();
      vCtx.moveTo(x1, y1);
      vCtx.lineTo(x2, y2);
      vCtx.stroke();
      const angle = Math.atan2(y2 - y1, x2 - x1);
      const headLen = stroke.corrected && len < 20 ? 8 : 11;
      vCtx.beginPath();
      vCtx.moveTo(x2, y2);
      vCtx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 7), y2 - headLen * Math.sin(angle - Math.PI / 7));
      vCtx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 7), y2 - headLen * Math.sin(angle + Math.PI / 7));
      vCtx.closePath();
      vCtx.fill();
    }

    function vDrawDigitAt(digit, x, y) {
      vCtx.font = V_DIGIT_FONT;
      vCtx.fillStyle = V_INK;
      vCtx.textAlign = "center";
      vCtx.textBaseline = "middle";
      vCtx.fillText(digit, x, y);
    }

    function vGetSlotCenter(zone) {
      const el = vSlotEls[zone];
      const sheetRect = sheet.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      return { x: (r.left + r.right) / 2 - sheetRect.left, y: (r.top + r.bottom) / 2 - sheetRect.top };
    }

    function redrawVertical() {
      const w = writeCanvas.width / (window.devicePixelRatio || 1);
      const h = writeCanvas.height / (window.devicePixelRatio || 1);
      vCtx.clearRect(0, 0, w, h);
      for (const s of vStrokes) {
        if (s.type === "above") vDrawArrow(s);
        else if (s.type === "digit") {
          const c = vGetSlotCenter(s.zone);
          vDrawDigitAt(s.digit, c.x, c.y + 1);
        } else if (s.type === "nearAbove") {
          vCtx.font = s.carry ? V_CARRY_FONT : V_DIGIT_FONT;
          vCtx.fillStyle = s.carry ? V_ARROW : V_INK;
          vCtx.textAlign = "center";
          vCtx.textBaseline = "middle";
          vCtx.fillText(s.digit, s.x, s.y);
        } else if (s.type === "zonePending" || s.type === "tensPending" || s.type === "free") vDrawPath(s.points, V_INK, 3);
      }
      if (vDrawing && vLivePoints.length > 1) vDrawPath(vLivePoints, V_INK, 3);
    }

    function vShowOnesEq() {
      if (vOnesShown) return;
      vOnesShown = true;
      vEquations.innerHTML = `<div class="eq">${getVerticalMeta().onesEq}</div>`;
    }

    function vShowTensEqs() {
      if (vTensShown) return;
      vTensShown = true;
      const m = getVerticalMeta();
      const lines = [m.onesEq];
      if (m.tensEq1) lines.push(m.tensEq1);
      if (!m.hasThousands && m.resultZones[0] === "hundreds") lines.push(m.tensEq2);
      vEquations.innerHTML = lines.map((t) => `<div class="eq">${t}</div>`).join("");
    }

    function vShowFinalEqs() {
      if (vFinalShown) return;
      vFinalShown = true;
      const m = getVerticalMeta();
      vEquations.innerHTML = [m.onesEq, m.tensEq1, m.tensEq2].filter(Boolean).map((t) => `<div class="eq">${t}</div>`).join("");
    }

    function vRemoveDigit(zone) {
      for (let i = vStrokes.length - 1; i >= 0; i--) {
        if (vStrokes[i].type === "digit" && vStrokes[i].zone === zone) vStrokes.splice(i, 1);
      }
    }

    function vRemovePendingForZone(zone) {
      for (let i = vStrokes.length - 1; i >= 0; i--) {
        const s = vStrokes[i];
        if ((s.type === "zonePending" || s.type === "tensPending") && s.zone === zone) vStrokes.splice(i, 1);
      }
    }

    function shouldVerticalFlowForZone(zone) {
      const place = V_ZONE_TO_PLACE[zone];
      return place && Math.floor(numA / place) % 10 > 0;
    }

    function vHandleBelowWrite(zone, pts, meta) {
      const answer = meta.answerDigits[zone];
      if (answer == null) return;
      const need = meta.strokesForZone(zone);
      vWriteCounts[zone] = (vWriteCounts[zone] || 0) + 1;
      if (vWriteCounts[zone] < need) {
        vStrokes.push({ type: "zonePending", points: pts.slice(), zone });
        return;
      }
      vRemovePendingForZone(zone);
      vRemoveDigit(zone);
      vStrokes.push({ type: "digit", zone, digit: answer });

      if (zone === "ones") {
        vShowOnesEq();
        if (shouldVerticalFlowForZone(zone) && !vStrokes.some((s) => s.type === "above" && s.target === zone)) {
          verticalPlaceFlow(V_ZONE_TO_PLACE[zone]);
        }
      } else if (zone === "tens") {
        vShowTensEqs();
        if (shouldVerticalFlowForZone(zone) && !vStrokes.some((s) => s.type === "above" && s.target === zone)) {
          verticalPlaceFlow(V_ZONE_TO_PLACE[zone]);
        }
      } else if (shouldVerticalFlowForZone(zone) && !vStrokes.some((s) => s.type === "above" && s.target === zone)) {
        verticalPlaceFlow(V_ZONE_TO_PLACE[zone]);
      }

      if (zone === meta.resultZones[0]) vShowFinalEqs();
    }

    function vCommitStroke(pts) {
      const hit = vClassifyStroke(pts, getVerticalZones());
      if (!hit) return;
      const meta = getVerticalMeta();

      if (hit.type === "above") {
        const target = arrowTargetForNewStroke();
        for (let i = vStrokes.length - 1; i >= 0; i--) {
          if (vStrokes[i].type === "above" && vStrokes[i].target === target) vStrokes.splice(i, 1);
        }
        vStrokes.push(vBuildArrow(target));
        if (shouldVerticalFlowForZone(target)) verticalPlaceFlow(V_ZONE_TO_PLACE[target] || 1);
        return;
      }

      if (hit.type === "nearAbove") {
        if (hit.carry && hit.column) {
          for (let i = vStrokes.length - 1; i >= 0; i--) {
            const s = vStrokes[i];
            if (s.type === "nearAbove" && s.carry && s.column === hit.column) vStrokes.splice(i, 1);
          }
        }
        vStrokes.push(hit);
        return;
      }

      if (hit.type === "free") {
        vStrokes.push(hit);
        return;
      }

      if (hit.type === "below") {
        vHandleBelowWrite(hit.zone, pts, meta);
      }
    }

    function resetVerticalSheet(clearEq = true) {
      vStrokes.length = 0;
      vWriteCounts = {};
      vOnesShown = false;
      vTensShown = false;
      vFinalShown = false;
      resetVerticalGather();
      if (clearEq) vEquations.innerHTML = "";
      vLivePoints = [];
      vDrawing = false;
      redrawVertical();
    }

    function vGetPos(e) {
      const rect = writeCanvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    writeCanvas.addEventListener("mousedown", (e) => {
      e.preventDefault();
      vDrawing = true;
      vLivePoints = [vGetPos(e)];
      redrawVertical();
    });
    writeCanvas.addEventListener("mousemove", (e) => {
      if (!vDrawing) return;
      e.preventDefault();
      vLivePoints.push(vGetPos(e));
      redrawVertical();
    });
    writeCanvas.addEventListener("mouseup", (e) => {
      if (!vDrawing) return;
      e.preventDefault();
      vDrawing = false;
      vCommitStroke(vLivePoints);
      vLivePoints = [];
      redrawVertical();
    });
    writeCanvas.addEventListener("mouseleave", () => {
      if (vDrawing) {
        vDrawing = false;
        vCommitStroke(vLivePoints);
        vLivePoints = [];
        redrawVertical();
      }
    });
    writeCanvas.addEventListener("touchstart", (e) => { e.preventDefault(); vDrawing = true; vLivePoints = [vGetPos(e)]; redrawVertical(); }, { passive: false });
    writeCanvas.addEventListener("touchmove", (e) => { if (!vDrawing) return; e.preventDefault(); vLivePoints.push(vGetPos(e)); redrawVertical(); }, { passive: false });
    writeCanvas.addEventListener("touchend", (e) => { if (!vDrawing) return; e.preventDefault(); vDrawing = false; vCommitStroke(vLivePoints); vLivePoints = []; redrawVertical(); }, { passive: false });
    vResetBtn.addEventListener("click", () => resetVerticalSheet(true));
    vNextBtn.addEventListener("click", () => nextVerticalProblem());

    window.addEventListener("resize", resize);
    resize();
    applyVerticalProblem();
    loop();
  </script>
</body>
</html>
