<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>乘法积木 · 3D 可视化</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #050a14;
      color: #e8eef8;
      -webkit-tap-highlight-color: transparent;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    #canvas-wrap canvas { display: block; width: 100%; height: 100%; }

    .overlay { position: fixed; z-index: 10; pointer-events: none; }
    .overlay * { pointer-events: auto; }

    .panel {
      top: 14px;
      left: 14px;
      width: min(252px, 46vw);
      padding: 15px;
      background: rgba(18, 24, 38, 0.82);
      border: 1px solid rgba(120, 150, 200, 0.22);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
    }

    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .field .icon {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }
    .icon-a { background: rgba(231, 76, 60, 0.35); color: #ff8a80; }
    .icon-b { background: rgba(155, 89, 182, 0.35); color: #ce93d8; }
    .field label { flex: 1; opacity: 0.92; white-space: nowrap; }
    .field .val {
      min-width: 64px;
      min-height: 32px;
      padding: 6px 12px;
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 600;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .field .val.empty {
      color: rgba(232, 238, 248, 0.35);
    }
    .field .val.empty::after {
      content: "—";
    }
    .field .val:hover, .field .val.active {
      border-color: rgba(100, 180, 255, 0.65);
      box-shadow: 0 0 12px rgba(52, 152, 219, 0.35);
    }

    .btn-row { margin-top: 8px; }
    .btn-row > .btn:first-child { margin-top: 0; }
    .btn-flow {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      margin-top: 10px;
    }
    .btn-flow .btn { margin-top: 0; }
    .flow-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      color: rgba(160, 190, 230, 0.8);
      font-size: 17px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 0 8px rgba(52, 152, 219, 0.35);
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 12px 14px;
      margin-top: 10px;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
      letter-spacing: 0.02em;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); filter: brightness(0.95); }
    .btn-purple { background: linear-gradient(135deg, #8e44ad, #9b59b6); box-shadow: 0 4px 16px rgba(142, 68, 173, 0.45); }
    .btn-orange { background: linear-gradient(135deg, #d35400, #e67e22); box-shadow: 0 4px 16px rgba(230, 126, 34, 0.4); }
    .btn-green { background: linear-gradient(135deg, #1e8449, #27ae60); box-shadow: 0 4px 16px rgba(39, 174, 96, 0.4); }
    .btn-blue { background: linear-gradient(135deg, #2471a3, #3498db); box-shadow: 0 4px 16px rgba(52, 152, 219, 0.4); }

    .eq-wrap {
      top: 56px;
      right: 14px;
      left: auto;
      width: min(292px, 50vw);
      pointer-events: none;
    }

    .eq-panel {
      padding: 16px 18px;
      background: rgba(10, 16, 28, 0.88);
      border: 1px solid rgba(120, 150, 200, 0.22);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
    }
    .eq-panel-title {
      font-size: 14px;
      color: #7ec8ff;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: 0.08em;
    }
    .eq-lines {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .eq-line {
      font-size: 20px;
      font-weight: 600;
      line-height: 1.55;
      color: #e8eef8;
      letter-spacing: 0.04em;
      animation: eqFadeIn 0.35s ease forwards;
    }
    .eq-line.main { color: #fff; font-size: 23px; }
    .eq-line.sum { color: #7bed9f; }
    @keyframes eqFadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .hint-top {
      top: 14px;
      right: 14px;
      left: auto;
      max-width: min(280px, 52vw);
      font-size: 12px;
      line-height: 1.55;
      color: rgba(232, 238, 248, 0.88);
      text-align: right;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
    }

    .hint-bottom {
      bottom: 14px;
      left: 14px;
      max-width: min(340px, 70vw);
      padding: 10px 14px;
      background: rgba(10, 16, 28, 0.72);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      line-height: 1.65;
      pointer-events: none;
    }
    .hint-bottom strong { color: #7ec8ff; font-weight: 600; }

    .hint-br {
      bottom: 14px;
      right: 14px;
      left: auto;
      max-width: min(260px, 48vw);
      font-size: 11px;
      line-height: 1.55;
      color: rgba(200, 210, 230, 0.75);
      text-align: right;
      pointer-events: none;
    }

    /* 数字键盘 */
    .keypad-wrap {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.35);
    }
    .keypad-wrap.show { display: flex; }
    .keypad {
      width: min(280px, 88vw);
      padding: 16px;
      background: rgba(28, 34, 48, 0.95);
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .key {
      aspect-ratio: 1;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      color: #e8eef8;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .key:hover { background: rgba(255, 255, 255, 0.16); }
    .key.highlight {
      background: rgba(52, 152, 219, 0.45);
      box-shadow: 0 0 16px rgba(52, 152, 219, 0.6);
    }
    .key-del { background: rgba(231, 76, 60, 0.75); font-size: 16px; }
    .key-close { background: rgba(120, 130, 150, 0.5); }
    .key-ok { background: rgba(39, 174, 96, 0.85); font-size: 18px; }
    .key-wide { grid-column: span 1; }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>

  <div class="overlay panel">
    <div class="field">
      <span class="icon icon-a">✎</span>
      <label>多位数</label>
      <span class="val" id="valA" data-target="a">12</span>
    </div>
    <div class="field">
      <span class="icon icon-b">×</span>
      <label>一位数</label>
      <span class="val" id="valB" data-target="b">3</span>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn-purple" id="btnGen">⊕ 生成 &amp; 重置</button>
      <div class="btn-flow">
        <button type="button" class="btn btn-orange" id="btnSplit">⇄ 拆 (Split)</button>
        <span class="flow-arrow" aria-hidden="true">↓</span>
        <button type="button" class="btn btn-blue" id="btnCalc">∑ 算 (Calc)</button>
        <span class="flow-arrow" aria-hidden="true">↓</span>
        <button type="button" class="btn btn-green" id="btnCombine">⊕ 合 (Combine)</button>
      </div>
    </div>
  </div>

  <div class="overlay hint-top" id="hintTop"></div>
  <div class="overlay eq-wrap">
    <div class="eq-panel" id="eqPanel">
      <div class="eq-panel-title">算式</div>
      <div class="eq-lines" id="eqLines"></div>
    </div>
  </div>
  <div class="overlay hint-bottom" id="hintBottom"></div>
  <div class="overlay hint-br" id="hintBr"></div>

  <div class="keypad-wrap" id="keypadWrap">
    <div class="keypad">
      <div class="keypad-grid" id="keypadGrid"></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const GROUP_COLORS = [0xe67e22, 0xf1c40f, 0x3498db, 0x9b59b6, 0x1abc9c, 0xe74c3c, 0x2ecc71, 0x95a5a6, 0xd35400];
    const TENS_COLOR = 0xe67e22;
    const ONES_COLOR = 0x3498db;
    const BLOCK = 0.42;
    const GAP = 0.46;
    const COL_STEP = 1.05;
    const PLACES = [1, 10, 100, 1000];
    const MAX_NUM_A = 9999;

    let numA = 12, numB = 3;
    let mode = "multiply"; // multiply | decompose | calculate | combine
    let eqStep = 0; // 0 空 | 1 总式 | 2 +按位乘 | 3 +相加
    let blocks = [];
    let keypadTarget = null;
    let keypadBuffer = "";

    const wrap = document.getElementById("canvas-wrap");
    const hintTop = document.getElementById("hintTop");
    const eqLinesEl = document.getElementById("eqLines");
    const hintBottom = document.getElementById("hintBottom");
    const hintBr = document.getElementById("hintBr");
    const valA = document.getElementById("valA");
    const valB = document.getElementById("valB");
    const keypadWrap = document.getElementById("keypadWrap");
    const keypadGrid = document.getElementById("keypadGrid");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050a14);
    scene.fog = new THREE.Fog(0x050a14, 18, 42);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    camera.position.set(6, 7.5, 11);
    camera.lookAt(0, 2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    wrap.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 2.2, 0);
    controls.minDistance = 5;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.enablePan = false;

    scene.add(new THREE.AmbientLight(0x4466aa, 0.55));
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(8, 14, 6);
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    scene.add(dir);
    const rim = new THREE.DirectionalLight(0x88bbff, 0.35);
    rim.position.set(-6, 4, -8);
    scene.add(rim);

    const blockGroup = new THREE.Group();
    scene.add(blockGroup);

    const grid = new THREE.GridHelper(24, 24, 0x2a5a8a, 0x152535);
    grid.position.y = 0.01;
    scene.add(grid);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.MeshStandardMaterial({ color: 0x081018, transparent: true, opacity: 0.85 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    function getPlaceDigits(n) {
      return PLACES.map((place) => ({
        place,
        digit: Math.floor(n / place) % 10
      }));
    }

    function placeUnitWidth(place) {
      if (place === 100) return 10 * COL_STEP;
      if (place === 1000) return 100 * COL_STEP;
      return COL_STEP;
    }

    function placeGroupWidth(place, count) {
      return count * placeUnitWidth(place);
    }

    function decomposeExpr(n) {
      return getPlaceDigits(n)
        .filter((p) => p.digit > 0)
        .map((p) => String(p.digit * p.place))
        .reverse()
        .join(" + ");
    }

    function splitDescFromPlaces(places) {
      return [...places]
        .reverse()
        .filter((p) => p.digit > 0)
        .map((p) => (p.place === 1 ? `${p.digit} 个一` : `${p.digit} 个整${p.place}`))
        .join(" + ");
    }

    function getEquationPartials(n, b) {
      return getPlaceDigits(n)
        .filter((p) => p.digit > 0)
        .map((p) => ({
          term: p.digit * p.place,
          value: p.digit * p.place * b
        }));
    }

    function getEquationLineItems(step) {
      const product = numA * numB;
      const partials = getEquationPartials(numA, numB);
      const items = [];
      if (step >= 1) items.push({ cls: "main", text: `${numA}×${numB}=${product}` });
      if (step >= 2) {
        for (const p of partials) items.push({ cls: "partial", text: `${p.term}×${numB}=${p.value}` });
      }
      if (step >= 3) {
        const sumExpr = [...partials].reverse().map((p) => p.value).join("+");
        items.push({ cls: "sum", text: `${sumExpr}=${product}` });
      }
      return items;
    }

    function renderEqPanel() {
      const items = getEquationLineItems(eqStep);
      eqLinesEl.innerHTML = items
        .map((item) => `<div class="eq-line ${item.cls}">${item.text}</div>`)
        .join("");
    }

    function setEqStep(step) {
      const prevStep = eqStep;
      eqStep = step;
      if (step < prevStep) {
        renderEqPanel();
        return;
      }
      renderEqPanel();
    }

    /** 合模式左下角公式 */
    function formatCombineFormula(n, b) {
      const product = n * b;
      const partials = getEquationPartials(n, b);
      const lines = [`${n}×${b}=${product}`];
      for (const p of partials) lines.push(`${p.term}×${b}=${p.value}`);
      const sumExpr = [...partials].reverse().map((p) => p.value).join("+");
      lines.push(`${sumExpr}=${product}`);
      return lines.join("<br>");
    }

    function groupInnerWidth(places) {
      let w = 0;
      for (const { place, digit } of [...places].reverse()) {
        if (digit === 0) continue;
        w += place === 1 ? COL_STEP : placeGroupWidth(place, digit);
      }
      return w;
    }

    /** 绘制一个 place 位值单元（整10/整100/整1000），返回占用宽度 */
    function drawPlaceUnit(baseX, z, place, color) {
      if (place === 10) {
        for (let y = 0; y < 10; y++) addBlock(baseX, y, z, color);
      } else if (place === 100) {
        for (let cx = 0; cx < 10; cx++) {
          for (let y = 0; y < 10; y++) addBlock(baseX + cx * COL_STEP, y, z, color);
        }
      } else if (place === 1000) {
        for (let flat = 0; flat < 10; flat++) {
          const flatX = baseX + flat * 10 * COL_STEP;
          for (let cx = 0; cx < 10; cx++) {
            for (let y = 0; y < 10; y++) addBlock(flatX + cx * COL_STEP, y, z, color);
          }
        }
      }
      return placeUnitWidth(place);
    }

    function drawPlaceGroup(baseX, z, place, digit, color) {
      let w = 0;
      for (let i = 0; i < digit; i++) {
        drawPlaceUnit(baseX + w, z, place, color);
        w += placeUnitWidth(place);
      }
      return w;
    }

    function parseInputs() {
      numA = Math.min(MAX_NUM_A, Math.max(1, parseInt(valA.textContent, 10) || 12));
      numB = Math.min(9, Math.max(1, parseInt(valB.textContent, 10) || 1));
      valA.textContent = numA;
      valB.textContent = numB;
      const places = getPlaceDigits(numA);
      return { places, product: numA * numB };
    }

    function clearBlocks() {
      for (const b of blocks) {
        blockGroup.remove(b.mesh);
        b.mesh.geometry.dispose();
        b.mesh.material.dispose();
      }
      blocks = [];
    }

    function makeBlock(color, emissive = 0) {
      const geo = new THREE.BoxGeometry(BLOCK * 0.92, BLOCK * 0.92, BLOCK * 0.92);
      const mat = new THREE.MeshStandardMaterial({
        color,
        emissive: new THREE.Color(emissive),
        emissiveIntensity: emissive ? 0.35 : 0,
        metalness: 0.15,
        roughness: 0.55
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
      );
      mesh.add(edges);
      return mesh;
    }

    function addBlock(x, y, z, color, emissive = 0) {
      const mesh = makeBlock(color, emissive);
      mesh.position.set(x * GAP, y * GAP + BLOCK / 2, z * GAP);
      blockGroup.add(mesh);
      blocks.push({ mesh, x, y, z, color });
      return mesh;
    }

    function animateIn() {
      if (blocks.length > 400) {
        blocks.forEach((b) => b.mesh.scale.setScalar(1));
        return;
      }
      blocks.forEach((b, i) => {
        b.mesh.scale.set(0.01, 0.01, 0.01);
        const targetY = b.mesh.position.y;
        b.mesh.position.y = targetY + 2;
        const delay = i * 18;
        setTimeout(() => {
          const start = performance.now();
          const dur = 380;
          function tick(now) {
            const t = Math.min(1, (now - start) / dur);
            const e = 1 - Math.pow(1 - t, 3);
            b.mesh.scale.setScalar(0.01 + 0.99 * e);
            b.mesh.position.y = targetY + 2 * (1 - e);
            if (t < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        }, delay);
      });
    }

  /** 拆：按各位数拆成整1/整10/整100/整1000 列，组内同色 */
    function buildDecompose() {
      clearBlocks();
      const { places } = parseInputs();
      const groups = numB;
      const groupInnerW = groupInnerWidth(places);
      const groupW = groupInnerW + 1.0;
      const startX = -((groups - 1) * groupW) / 2;

      for (let g = 0; g < groups; g++) {
        const gx = startX + g * groupW;
        const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
        let x = gx - groupInnerW / 2;

        for (const { place, digit } of [...places].reverse()) {
          if (digit === 0) continue;
          if (place === 1) {
            for (let y = 0; y < digit; y++) addBlock(x + COL_STEP / 2, y, 0, colColor);
            x += COL_STEP;
          } else {
            x += drawPlaceGroup(x, 0, place, digit, colColor);
          }
        }
      }

      centerGroup();
      animateIn();
      updateHints();
    }

  /** 分模式：乘数份，每组一整列（未拆），组内同色 */
    function buildMultiply() {
      clearBlocks();
      const groups = numB;
      const groupW = 1.15;
      const startX = -((groups - 1) * groupW) / 2;

      for (let g = 0; g < groups; g++) {
        const gx = startX + g * groupW;
        const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
        for (let y = 0; y < numA; y++) addBlock(gx, y, 0, colColor);
      }

      centerGroup();
      animateIn();
      updateHints();
    }

  /** 合/算：各位乘积合并（合模式时整位与个位横向更紧凑） */
    function buildCombine() {
      clearBlocks();
      const { places } = parseInputs();
      const tight = mode === "combine";
      const segGap = (nextPlace) => (tight ? 0.15 : nextPlace === 1 ? 0.6 : 0.4);
      const activePlaces = [...places].reverse().filter((p) => p.digit > 0);

      let totalW = 0;
      activePlaces.forEach((p, i) => {
        if (p.place === 1) totalW += numB * COL_STEP;
        else totalW += placeGroupWidth(p.place, p.digit * numB);
        const next = activePlaces[i + 1];
        if (next) totalW += segGap(next.place);
      });

      let x = -totalW / 2;
      activePlaces.forEach((p, i) => {
        const { place, digit } = p;
        if (place === 1) {
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            for (let y = 0; y < digit; y++) {
              addBlock(x + g * COL_STEP + COL_STEP / 2, y, 0.6, colColor);
            }
          }
          x += numB * COL_STEP;
        } else {
          for (let g = 0; g < numB; g++) {
            const colColor = GROUP_COLORS[g % GROUP_COLORS.length];
            for (let d = 0; d < digit; d++) {
              drawPlaceUnit(x, -0.4, place, colColor);
              x += placeUnitWidth(place);
            }
          }
        }
        const next = activePlaces[i + 1];
        if (next) x += segGap(next.place);
      });

      centerGroup();
      animateIn();
      updateHints();
    }

    function centerGroup() {
      const box = new THREE.Box3().setFromObject(blockGroup);
      if (box.isEmpty()) return;
      const c = box.getCenter(new THREE.Vector3());
      blockGroup.position.x = -c.x;
      blockGroup.position.z = -c.z;
    }

    function updateHints() {
      const { places, product } = parseInputs();
      const expr = decomposeExpr(numA);
      const splitDesc = splitDescFromPlaces(places);

      if (mode === "decompose") {
        hintTop.textContent = `拆模式：每组 ${splitDesc}，组内颜色相同`;
        hintBottom.innerHTML = `<strong>当前算式：</strong> ${numA} × ${numB} = ${product}<br>${numA} = ${expr}，共 ${numB} 组`;
        hintBr.textContent = "当前模式：拆模式。整10/100/1000 列数 = 对应位数字。";
      } else if (mode === "calculate") {
        hintTop.textContent = `算模式：按位相乘再相加`;
        hintBottom.innerHTML = `<strong>分步计算：</strong><br>${formatCombineFormula(numA, numB)}`;
        hintBr.textContent = "当前模式：算模式。积木布局与「合」相同，显示分步算式。";
      } else if (mode === "multiply") {
        hintTop.textContent = `分模式：${numB} 组，每组 ${numA} 个方块一列，组内颜色相同`;
        hintBottom.innerHTML = `<strong>当前算式：</strong> ${numA} × ${numB} = ${product}<br>点击「拆」将每组拆成 ${splitDesc}`;
        hintBr.textContent = "当前模式：分模式。点击「拆」按各位数拆分。";
      } else {
        hintTop.textContent = `合模式：各位乘积合并（${splitDesc}）× ${numB}`;
        hintBottom.innerHTML = `<strong>乘积模式：</strong><br>${formatCombineFormula(numA, numB)}`;
        hintBr.textContent = "当前模式：合模式。已合并各位乘积结果。";
      }
    }

    function rebuild() {
      blockGroup.position.set(0, 0, 0);
      if (mode === "decompose") buildDecompose();
      else if (mode === "combine" || mode === "calculate") buildCombine();
      else buildMultiply();
    }

    function resize() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    function loop() {
      requestAnimationFrame(loop);
      controls.update();
      renderer.render(scene, camera);
    }

    /* 数字键盘 */
    const keys = ["1","2","3","4","5","6","7","8","9","00","0"];
    keys.forEach((k) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "key";
      btn.textContent = k;
      btn.addEventListener("click", () => {
        const maxLen = keypadTarget === "a" ? 4 : 1;
        if (keypadTarget === "b" && k === "00") return;
        if (k === "00" && keypadBuffer.length > 0) return;
        if (keypadBuffer.length >= maxLen) return;
        if (k === "00" && keypadBuffer.length + 2 > maxLen) return;
        keypadBuffer += k;
        syncKeypadDisplay();
        refreshKeypadHighlight();
      });
      keypadGrid.appendChild(btn);
    });

    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "key key-del";
    delBtn.textContent = "⌫";
    delBtn.addEventListener("click", () => {
      keypadBuffer = keypadBuffer.slice(0, -1);
      syncKeypadDisplay();
      refreshKeypadHighlight();
    });
    keypadGrid.appendChild(delBtn);

    const closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.className = "key key-close";
    closeBtn.textContent = "✕";
    closeBtn.addEventListener("click", () => closeKeypad(true));
    keypadGrid.appendChild(closeBtn);

    const okBtn = document.createElement("button");
    okBtn.type = "button";
    okBtn.className = "key key-ok";
    okBtn.textContent = "✓";
    okBtn.addEventListener("click", confirmKeypad);
    keypadGrid.appendChild(okBtn);

    function refreshKeypadHighlight() {
      keypadGrid.querySelectorAll(".key").forEach((el) => el.classList.remove("highlight"));
    }

    function syncKeypadDisplay() {
      const setVal = (el, text) => {
        if (text === "") {
          el.textContent = "";
          el.classList.add("empty");
        } else {
          el.textContent = text;
          el.classList.remove("empty");
        }
      };
      if (keypadTarget === "a") setVal(valA, keypadBuffer);
      else if (keypadTarget === "b") setVal(valB, keypadBuffer);
    }

    function restorePanelValues() {
      valA.textContent = numA;
      valB.textContent = numB;
      valA.classList.remove("empty");
      valB.classList.remove("empty");
    }

    function openKeypad(target) {
      keypadTarget = target;
      keypadBuffer = target === "a" ? String(numA) : String(numB);
      valA.classList.toggle("active", target === "a");
      valB.classList.toggle("active", target === "b");
      syncKeypadDisplay();
      keypadWrap.classList.add("show");
      refreshKeypadHighlight();
    }

    function closeKeypad(revert = true) {
      keypadWrap.classList.remove("show");
      valA.classList.remove("active");
      valB.classList.remove("active");
      if (revert) restorePanelValues();
      keypadTarget = null;
      keypadBuffer = "";
    }

    function confirmKeypad() {
      let v = parseInt(keypadBuffer, 10);
      if (isNaN(v) || keypadBuffer === "") v = keypadTarget === "a" ? 12 : 3;
      if (keypadTarget === "a") {
        v = Math.min(MAX_NUM_A, Math.max(1, v));
        numA = v;
        valA.textContent = v;
        valA.classList.remove("empty");
      } else {
        v = Math.min(9, Math.max(1, v));
        numB = v;
        valB.textContent = v;
        valB.classList.remove("empty");
      }
      closeKeypad(false);
    }

    valA.addEventListener("click", () => openKeypad("a"));
    valB.addEventListener("click", () => openKeypad("b"));
    keypadWrap.addEventListener("click", (e) => { if (e.target === keypadWrap) closeKeypad(true); });

    document.getElementById("btnGen").addEventListener("click", () => {
      parseInputs();
      mode = "multiply";
      setEqStep(1);
      rebuild();
    });
    document.getElementById("btnSplit").addEventListener("click", () => {
      parseInputs();
      mode = "decompose";
      rebuild();
    });
    document.getElementById("btnCalc").addEventListener("click", () => {
      parseInputs();
      mode = "calculate";
      setEqStep(Math.max(eqStep, 2));
      buildCombine();
    });
    document.getElementById("btnCombine").addEventListener("click", () => {
      parseInputs();
      mode = "combine";
      setEqStep(3);
      rebuild();
    });

    window.addEventListener("resize", resize);
    resize();
    parseInputs();
    mode = "multiply";
    setEqStep(1);
    rebuild();
    loop();
  </script>
</body>
</html>
